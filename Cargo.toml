[package]
name = "rune-browser"
version = "0.1.0"
edition = "2024"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21", features = ["native-file-dialog"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cef = { version = "156", default-features = false, features = ["sandbox"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[features]
# Live Rust editing via Rune's scripts/rune-dev.
hot = ["rune/hot"]
# Headless agent tooling (--snap, --tree, --script) in release builds; debug builds always have it.
tooling = ["rune/tooling"]

# Rune patches these crates; a dependency's [patch] doesn't reach this workspace, so repeat them
# from the same rev. Keep in sync with the [patch.crates-io] table in Rune's root Cargo.toml.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }

# Matches Rune's own profiles: line tables keep backtraces without huge debug builds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true
